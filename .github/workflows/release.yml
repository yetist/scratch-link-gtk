name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  source:
    name: Source tarball
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build valac gcc git \
            libglib2.0-dev libgtk-3-dev libsoup-3.0-dev libjson-glib-dev

      - name: Create tarball
        run: |
          meson setup build --buildtype=release
          meson dist -C build --no-tests

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/meson-dist/*.tar.xz
            build/meson-dist/*.sha256sum

  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build bundle
        run: |
          flatpak-builder --repo=repo --force-clean --disable-rofiles-fuse \
            build-flatpak packaging/flatpak/org.scratchlink.Gtk.yml
          flatpak build-bundle repo scratch-link-gtk.flatpak \
            org.scratchlink.Gtk master

      - name: Attach bundle to release
        uses: softprops/action-gh-release@v2
        with:
          files: scratch-link-gtk.flatpak

  rpm:
    name: RPM packages
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      # actions/checkout needs git to create a real repository; meson dist
      # later requires that repository.
      - name: Install git for checkout
        run: dnf install -y git

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust the checked-out repository
        run: git config --global --add safe.directory '*'

      - name: Install build dependencies
        run: |
          dnf install -y rpm-build rpmdevtools meson ninja-build vala gcc git \
            glib2-devel gtk3-devel libsoup3-devel json-glib-devel \
            libayatana-appindicator-gtk3-devel systemd-rpm-macros

      - name: Build RPM and SRPM
        run: |
          rpmdev-setuptree
          meson setup build --buildtype=release
          meson dist -C build --no-tests
          cp build/meson-dist/scratch-link-gtk-*.tar.xz ~/rpmbuild/SOURCES/
          cp packaging/rpm/scratch-link-gtk.spec ~/rpmbuild/SPECS/
          rpmbuild -ba ~/rpmbuild/SPECS/scratch-link-gtk.spec
          mkdir -p artifacts
          cp ~/rpmbuild/RPMS/*/*.rpm ~/rpmbuild/SRPMS/*.rpm artifacts/

      - name: Attach packages to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.rpm
